# retrofetch sprite roster
#
# Each [[sprite]] becomes a character in the binary once sprites/png/<id>.png exists.
#
# Fields
#   id, name, game, company, console, year   metadata shown by --list and the caption
#   console     snes | genesis | arcade | neogeo | pce
#   source      URL of the sheet you used (credit; Spriters Resource sheet page)
#   sheet       file name inside sheets/ (gitignored). Default convention: <id>.png
#   crop        [x, y, w, h] box on the sheet — get it from `cargo xtask detect sheets/<file>`
#   bg          colour(s) keyed to transparent: "#rrggbb" or ["#..", "#.."]
#               (default: the sheet's top-left pixel)
#   downscale   integer shrink factor: sprites taller than 64px, or images stored at 2x/3x
#   url         direct image URL; `cargo xtask fetch` downloads it to sheets/<sheet>.
#               With a url and no crop, the whole image is the sprite.
#   flood       true = only clear background connected to the edges (keeps white eyes etc.)
#
# Workflow (direct url):  `cargo xtask fetch && cargo xtask crop`
# Workflow (manual): download sheet in a browser -> save as sheets/<id>.png -> `cargo xtask detect`
#           -> fill `crop` -> `cargo xtask crop --id <id>` -> `cargo run -- --no-fetch <id>`

