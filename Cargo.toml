[workspace]
resolver = "2"
members = ["retrofetch", "xtask"]
default-members = ["retrofetch"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
